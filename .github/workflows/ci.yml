name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point bindgen at clang's built-in headers
        shell: pwsh
        run: |
          $dir = (& "C:\Program Files\LLVM\bin\clang.exe" -print-resource-dir).Replace('\', '/')
          "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir `"$dir`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install npm packages
        run: npm ci

      - name: Type-check UI
        run: npx tsc --noEmit

      - name: Check there is no network code
        run: node scripts/check-no-network.mjs

      # OCR tests need Tesseract's Bangla and English models. CI fetches them
      # here; the app itself never downloads anything (they ship as a
      # separate offline installer, see ocr-pack/).
      - name: Fetch OCR language data for the tests
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "tessdata"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($l in "ben", "eng") {
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/$l.traineddata" -OutFile (Join-Path $dir "$l.traineddata")
          }
          "AKKHOR_TESSDATA=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust tests (all phases)
        working-directory: src-tauri
        run: cargo test --all-targets -j 2

      - name: Speed targets in an optimised build (NFR-1.2, NFR-1.3, page tools)
        working-directory: src-tauri
        run: cargo test --release --test phase2 --test phase3 --test phase4 --test phase5 --test phase6 --test phase7

      - name: Upload test output (PDFs and renders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: src-tauri/test-output/
          if-no-files-found: ignore

  build:
    name: Build installer (Windows)
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Point bindgen at clang's built-in headers
        shell: pwsh
        run: |
          $dir = (& "C:\Program Files\LLVM\bin\clang.exe" -print-resource-dir).Replace('\', '/')
          "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir `"$dir`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci
      - name: Build installer
        run: npm run tauri build
      - name: Check installer size (SRS 4.2, max 27 MB)
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          foreach ($f in $files) {
            $mb = [math]::Round($f.Length / 1MB, 1)
            Write-Host "$($f.Name): $mb MB"
            if ($mb -gt 27) { Write-Error "$($f.Name) is over 27 MB"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
