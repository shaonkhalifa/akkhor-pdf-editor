name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point bindgen at clang's built-in headers
        shell: pwsh
        run: |
          $dir = (& "C:\Program Files\LLVM\bin\clang.exe" -print-resource-dir).Replace('\', '/')
          "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir `"$dir`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install npm packages
        run: npm ci

      - name: Type-check UI
        run: npx tsc --noEmit

      - name: Check there is no network code
        run: node scripts/check-no-network.mjs

      - name: Rust tests (script detection, Bangla shaping, text-edit spike)
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Speed targets in an optimised build (NFR-1.2, NFR-1.3)
        working-directory: src-tauri
        run: cargo test --release --test phase2

      - name: Upload test output (PDFs and renders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: src-tauri/test-output/
          if-no-files-found: ignore

  build:
    name: Build installer (Windows)
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Point bindgen at clang's built-in headers
        shell: pwsh
        run: |
          $dir = (& "C:\Program Files\LLVM\bin\clang.exe" -print-resource-dir).Replace('\', '/')
          "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir `"$dir`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci
      - name: Build installer
        run: npm run tauri build
      - name: Check installer size (SRS 4.2, max 27 MB)
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          foreach ($f in $files) {
            $mb = [math]::Round($f.Length / 1MB, 1)
            Write-Host "$($f.Name): $mb MB"
            if ($mb -gt 27) { Write-Error "$($f.Name) is over 27 MB"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
